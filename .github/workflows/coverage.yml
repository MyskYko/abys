name: coverage

on:
  push:
    branches:
      - main
  pull_request:

env:
  SLANG_RELEASE_TAG: slang-ubuntu-2026-06-29
  SLANG_TARBALL_SHA256: cd8d62c788cd49f05ded866268d4fe01d64a4a5c4f9e6ab77739a3bd4e21a94b

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr gdb
      - name: Cache slang (prebuilt)
        uses: actions/cache@v4
        with:
          path: _slang
          key: ${{ env.SLANG_RELEASE_TAG }}
      - name: Fetch slang (prebuilt)
        run: |
          if [ -d _slang/lib/cmake/slang ]; then
            echo "Using cached slang package"
            exit 0
          fi
          mkdir -p _slang
          curl -L -o slang-ubuntu-latest.tar.gz \
            https://github.com/MyskYko/slang/releases/download/${SLANG_RELEASE_TAG}/slang-ubuntu-latest.tar.gz
          if [ -n "${SLANG_TARBALL_SHA256:-}" ]; then
            echo "${SLANG_TARBALL_SHA256}  slang-ubuntu-latest.tar.gz" | sha256sum --check
          fi
          tar -xzf slang-ubuntu-latest.tar.gz -C _slang
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DABYS_ENABLE_COVERAGE=ON -Dslang_DIR="$PWD/_slang/lib/cmake/slang"
      - name: Build
        run: cmake --build build
      - name: Test
        run: |
          if ! ctest --test-dir build --output-on-failure; then
            cd build
            gdb -batch -ex run -ex bt --args ./abys_smoke_lowering_continuous_assign
            exit 1
          fi
      - name: Coverage report
        run: |
          gcovr -r . --xml -o build/coverage.xml
          gcovr -r . --html --html-details -o build/coverage.html
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/coverage.xml
            build/coverage.html
